name: Update Naukri Resume

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-resume-update
  cancel-in-progress: false

jobs:
  main-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Naukri authentication
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$NAUKRI_STORAGE_STATE" ]; then
            echo "ERROR: NAUKRI_STORAGE_STATE secret is missing."
            exit 1
          fi

          mkdir -p playwright/.auth

          printf '%s' "$NAUKRI_STORAGE_STATE" \
            | base64 --decode \
            > playwright/.auth/state.json

          if [ ! -s playwright/.auth/state.json ]; then
            echo "ERROR: Failed to create Playwright authentication state."
            exit 1
          fi

          echo "Playwright authentication state restored."

      - name: Test Naukri connectivity
        run: |
          echo "Testing Naukri connectivity..."
          curl --http1.1 -I -L --max-time 30 https://www.naukri.com/

          echo "Testing profile endpoint..."
          curl --http1.1 -I -L --max-time 30 https://www.naukri.com/mnjuser/profile || true

      - name: Update Naukri resume
        env:
          HEADLESS: 'false'
          RESUME_PATH: 'resume/Atharva_Hindukaje.pdf'
          AUTH_STATE_PATH: 'playwright/.auth/state.json'
          ARTIFACT_DIR: 'artifacts'
          DEBUG: 'pw:browser'
        run: |
          xvfb-run --auto-servernum npm run update

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-update-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove authentication state
        if: always()
        shell: bash
        run: |
          rm -f playwright/.auth/state.json
          echo "Temporary authentication state removed."
name: Test Naukri Connectivity

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: System information
        run: |
          echo "=== Runner ==="
          uname -a

          echo ""
          echo "=== Public IP ==="
          curl --max-time 15 https://api.ipify.org || true
          echo ""

      - name: DNS test
        run: |
          echo "=== DNS lookup ==="
          getent hosts www.naukri.com || true

          echo ""
          echo "=== DNS details ==="
          nslookup www.naukri.com || true

      - name: Test Naukri HTTPS
        run: |
          echo "=== HTTPS test ==="
          curl -v \
            --http1.1 \
            --connect-timeout 10 \
            --max-time 30 \
            https://www.naukri.com/ \
            -o /dev/null

      - name: Test Naukri IPv4
        run: |
          echo "=== IPv4 HTTPS test ==="
          curl -4 -v \
            --http1.1 \
            --connect-timeout 10 \
            --max-time 30 \
            https://www.naukri.com/ \
            -o /dev/null

      - name: Test Naukri IPv6
        run: |
          echo "=== IPv6 HTTPS test ==="
          curl -6 -v \
            --http1.1 \
            --connect-timeout 10 \
            --max-time 30 \
            https://www.naukri.com/ \
            -o /dev/null || true